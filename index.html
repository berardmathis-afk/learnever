<html lang="en"><head><meta charset="utf-8"><title>LEARNEVER – Never too late to Learn</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F7FF;--ink:#0B1B3F;--mut:#475577;--card:#fff;--line:#D9E2F7;--or:#3B4BE0;--onor:#fff;--soft:#E6EBFF;--ok:#065F46;--okb:#D9F7E8;--wn:#7A3E00;--wnb:#FFF1DB;--gr:#10B981;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-size:20px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0A1128;--ink:#EAF0FF;--mut:#A9B7DA;--card:#121C3D;--line:#263566;--or:#8F9BFF;--onor:#0A1128;--soft:#1A2650;--ok:#6EE7B7;--okb:#0E3B2E;--wn:#FDBA74;--wnb:#3A2A16}}
:root[data-theme=dark]{--bg:#0A1128;--ink:#EAF0FF;--mut:#A9B7DA;--card:#121C3D;--line:#263566;--or:#8F9BFF;--onor:#0A1128;--soft:#1A2650;--ok:#6EE7B7;--okb:#0E3B2E;--wn:#FDBA74;--wnb:#3A2A16}
html{scroll-padding-top:env(safe-area-inset-top,0px)}html.l{font-size:23px}html.x{font-size:27px}
html.hc{--bg:#fff;--ink:#000;--mut:#000;--line:#000;--or:#1F2FB8;--onor:#fff;--card:#fff;--soft:#E6EBFF}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;line-height:1.6}
h1,h2,h3{font-family:Sora,'Plus Jakarta Sans',system-ui,sans-serif;letter-spacing:-.02em;line-height:1.2;margin:0 0 .5rem}h1{font-size:2.2rem}h2{font-size:1.55rem}h3{font-size:1.2rem}p{margin:.4rem 0 .9rem;max-width:62ch}
button,input,select{font:inherit;color:inherit}
.b{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:56px;padding:.7rem 1.4rem;border-radius:14px;border:2px solid var(--or);background:var(--or);color:var(--onor);font-weight:700;cursor:pointer;margin:.25rem .25rem .25rem 0;text-align:left}
.b.s{background:transparent;color:var(--ink);border-color:var(--ink)}.b.o{width:100%;justify-content:flex-start;background:var(--card);color:var(--ink);border-color:var(--line)}
.b.on{background:var(--soft);border-color:var(--or)}.b:disabled{opacity:.5}
:focus-visible{outline:4px solid var(--or);outline-offset:3px}
.w{max-width:1000px;margin:0 auto;padding:1.2rem}.c{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:1.2rem;margin:0 0 1rem}
.g{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.g .c{margin:0}
.top{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:.5rem 1.2rem;border-bottom:2px solid var(--line)}.top img{height:56px}
nav.m{display:flex;gap:.3rem;margin-left:auto}nav.m button{background:none;border:0;border-radius:12px;padding:.4rem .8rem;min-height:56px;cursor:pointer;font-weight:700;display:flex;flex-direction:column;align-items:center;font-size:.8rem}
nav.m button[aria-current=page]{background:var(--soft);color:var(--or)}nav.m span{font-size:1.4rem}
@media(max-width:800px){nav.m{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--line);justify-content:space-around;margin:0;padding:.3rem .3rem calc(.3rem + env(safe-area-inset-bottom,0px));z-index:5}main{padding-bottom:5.5rem!important}.top{padding-top:.3rem}h1{font-size:2rem}}
.hero{display:grid;gap:2rem;grid-template-columns:1fr 1fr;align-items:center;padding:2rem;border-radius:28px;background:linear-gradient(135deg,#0B1B3F 30%,#2B3BC9);color:#fff}.hero .b{background:#10B981;border-color:#10B981;color:#04241A}.hero .b.s{background:transparent;border-color:#fff;color:#fff}.hero .sm{color:#C7D2FE}@media(max-width:800px){.hero{grid-template-columns:1fr}}
.hero img{width:min(320px,70%);margin:auto;display:block}
.bar{height:16px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#4F46E5,#10B981)}
.phone{max-width:340px;margin:1rem auto;border:6px solid var(--ink);border-radius:34px;background:var(--card);overflow:hidden}.phone header{background:var(--soft);padding:.5rem 1rem;font-size:.8rem;display:flex;justify-content:space-between}.phone div.pb{padding:1rem}
.fb{padding:.8rem 1rem;border-radius:14px;margin:.6rem 0;font-weight:700}.fb.y{background:var(--okb);color:var(--ok)}.fb.n{background:var(--wnb);color:var(--wn)}
.path{list-style:none;padding:0;margin:0}.path li{margin:0 0 .6rem}.path .b{width:100%;justify-content:flex-start}
.tag{display:inline-block;padding:.1rem .7rem;border-radius:99px;background:var(--soft);font-size:.85rem;font-weight:700}
.stuck{position:fixed;right:1rem;bottom:6.2rem;z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.25)}@media(min-width:801px){.stuck{bottom:1rem}}
.ov{position:fixed;inset:0;background:rgba(20,10,30,.6);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:9}.ov .c{max-width:520px;width:100%;max-height:90%;overflow:auto}
.msg{padding:.7rem 1rem;border-radius:16px;margin:.5rem 0;max-width:85%}.msg.c1{background:var(--soft)}.msg.u{background:var(--or);color:var(--onor);margin-left:auto}
.demo{position:sticky;top:0;z-index:7;background:var(--ink);color:var(--bg);padding:.4rem 1rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;font-size:.85rem}.demo .b{min-height:44px;background:var(--bg);color:var(--ink);border-color:var(--bg)}
input[type=text]{width:100%;box-sizing:border-box;min-height:56px;padding:.5rem 1rem;border-radius:14px;border:2px solid var(--ink);background:var(--card)}
.big{font-size:2.2rem;font-weight:700;font-family:Sora,sans-serif}.sm{font-size:.85rem;color:var(--mut)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}html.rm *{animation:none!important;transition:none!important}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}.fb{animation:pop .25s}
.big{color:var(--or)}.tag{color:var(--or)}.fb.y{border-left:6px solid var(--gr)}.fact{background:var(--soft);border-left:6px solid var(--gr);border-radius:14px;padding:.8rem 1rem;margin:.8rem 0;animation:pop .3s}.fact b{display:block;color:var(--or)}.b.o{position:relative}.b:active{transform:scale(.97)}.hint{border-color:#10B981!important;border-width:4px;padding-right:3.6rem;box-shadow:0 0 0 6px rgba(16,185,129,.35);animation:glow 1.2s infinite}.hand{position:absolute;right:.9rem;top:50%;font-size:2rem;animation:tap 1s infinite}@keyframes glow{50%{box-shadow:0 0 0 12px rgba(16,185,129,.15)}}@keyframes tap{0%,100%{transform:translateY(-40%)}50%{transform:translateY(-70%) scale(.9)}}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}.toast{position:fixed;left:50%;top:5rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1.2rem;border-radius:99px;font-weight:700;z-index:30;animation:pop .3s}.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}@media(min-width:700px){.mg{grid-template-columns:repeat(4,1fr)}}.m3{grid-template-columns:repeat(3,1fr)!important}.deal{animation:deal .35s}@keyframes deal{from{transform:translateX(50px) rotate(4deg);opacity:0}to{transform:none;opacity:1}}.dark{background:linear-gradient(160deg,#0B1B3F,#0A0F24);color:#fff;border-radius:24px;padding:1.2rem;margin-bottom:1rem}.dark p{color:#E0E7FF}.dark .sm{color:#C7D2FE}.dark .b{background:#10B981;border-color:#10B981;color:#04241A}.sess{position:sticky;top:0;z-index:8;background:var(--ink);color:var(--bg);display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;padding:.4rem 1rem}.sess .b{min-height:44px;margin:0}.sess .b.s{color:var(--bg);border-color:var(--bg)}.chatb{position:fixed;left:1rem;bottom:6.2rem;z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.25)}@media(min-width:801px){.chatb{bottom:1rem}}</style></head><body>

{t:"Understanding Your Smartphone",e:"📱",k:0,w:"Your phone is a small computer that fits in your hand. Apps are its tools.",y:"Call, take photos, message and look things up wherever you are.",s:[["You want a brighter screen. Where do you go first?",["Settings","Camera","Photos"],"Settings is the control room of your phone."],["Which choice changes the screen light?",["Display & Brightness","Battery","Wi‑Fi"],"Display settings control how your screen looks."]],r:"Settings is the control room of your phone."},
{t:"Installing an App",e:"🛍️",k:1,w:"An app is a tool you add to your phone from an official shop.",y:"Add what you need, such as video calls, maps or your bank.",s:[["Which icon opens the official shop?",["App Store / Play Store","Photos","Clock"],"The store is the safe place to get apps."],["You typed the app's name. What do you tap?",["Get / Install","Delete","Report"],"Get or Install adds the app to your phone."]],r:"Only download apps from your phone's official store."},
{t:"Using ChatGPT",e:"🤖",k:2,w:"ChatGPT is an AI you talk to by typing. Ask it questions like you would ask a knowledgeable friend.",y:"Get recipes, explanations, letters or plans in seconds.",s:[["You want a dinner idea. Which question works best?",["Dinner?","Suggest a simple dinner for two using chicken and rice, ready in 30 minutes.","Food"],"Details give AI what it needs to help you."],["The answer is too long. What do you type?",["Make it shorter, in 3 steps, please.","This is wrong.","Stop"],"You can always ask AI to change its answer."]],r:"The more details you give AI, the better its answer."},
{t:"Sharing a Photo",e:"🖼️",k:3,w:"Sharing means sending a copy of something to another person.",y:"Show your friends and family what you see, instantly.",s:[["You are viewing a photo. What do you tap to send it?",["Share button","Trash can","Edit"],"Share is the doorway to every way of sending."],["Choose how to send it.",["Messages or WhatsApp","Calculator","Alarm"],"Messages and WhatsApp send to a contact."],["Last step?",["Send","Cancel","Lock"],"Send delivers your photo."]],r:"Every sharing journey starts with the Share button."},
{t:"Using AirDrop",e:"📡",k:3,w:"AirDrop (or Nearby Share on Android) sends photos to a phone next to you, with no internet needed.",y:"Perfect when your friend is sitting right beside you.",s:[["Your friend would like this photo. First tap?",["Share","Delete","Edit"],"Share opens your sending options."],["Now find the nearby option.",["AirDrop / Nearby Share","Print","Wallpaper"],"This sends to people close by."],["Choose the recipient.",["Your friend's name","Unknown device","Cancel"],"Only choose people you know."]],r:"Nearby sharing is the fastest way to send when someone is beside you."},
{t:"Creating a Document",e:"📄",k:5,w:"A document is a page you type, save and send, like a letter.",y:"Write letters, lists or CVs, and keep them safe.",s:[["How do you start a page?",["New document","Delete all","Restart"],"New starts a fresh page."],["You finished typing. What now?",["Save","Close without saving","Ignore"],"Saving keeps your work safe."],["Name it so you can find it.",["Type a clear name, like Shopping list","Leave it blank","Skip"],"A clear name saves searching later."]],r:"Save early and give your files clear names."},
{t:"Using YouTube",e:"▶️",k:6,w:"YouTube is a huge library of videos on almost anything.",y:"Learn a recipe, watch a concert or fix a tap.",s:[["Find a video about baking bread.",["Search bar","Profile","Settings"],"Type what you want, like a question."],["You can't hear well. What helps?",["Subtitles (CC)","Delete","Report"],"Subtitles show the words on screen."]],r:"Search YouTube by typing what you want to learn."},
{t:"Recognising an Online Scam",e:"🔐",k:7,w:"A scam is a message designed to make you rush and share private details.",y:"Knowing the signs keeps your money and information safe.",s:[["'Your bank account will close today! Click here.' What now?",["Don't click. Call the number on your bank card.","Click quickly","Reply with details"],"Real banks never rush you through a link."],["Which sign suggests a scam?",["Urgency and a strange link","A friend you know","A clear address"],"Pressure to act fast is the biggest clue."]],r:"If it feels rushed, stop and check another way."}];
